<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - White walls -->
  <rect width="800" height="800" fill="#FAFAFA"/>
  
  <!-- Floor - Light wood -->
  <rect y="600" width="800" height="200" fill="#E5D4B8"/>
  
  <!-- Window frame -->
  <rect x="100" y="80" width="280" height="350" fill="#FFFFFF" stroke="#D4B896" stroke-width="8"/>
  <line x1="240" y1="80" x2="240" y2="430" stroke="#D4B896" stroke-width="4"/>
  <line x1="100" y1="255" x2="380" y2="255" stroke="#D4B896" stroke-width="4"/>
  
  <!-- Window light -->
  <rect x="108" y="88" width="124" height="159" fill="#E8F4F8" opacity="0.6"/>
  <rect x="248" y="88" width="124" height="159" fill="#E8F4F8" opacity="0.6"/>
  <rect x="108" y="263" width="124" height="159" fill="#E8F4F8" opacity="0.6"/>
  <rect x="248" y="263" width="124" height="159" fill="#E8F4F8" opacity="0.6"/>
  
  <!-- Minimalist shelf -->
  <rect x="420" y="180" width="300" height="12" fill="#C9A980"/>
  <rect x="420" y="280" width="300" height="12" fill="#C9A980"/>
  
  <!-- Decorative items on shelves -->
  <circle cx="480" cy="160" r="18" fill="#B8C5B0"/>
  <rect x="540" y="148" width="30" height="40" fill="#789D91"/>
  <circle cx="630" cy="160" r="15" fill="#D4B896"/>
  
  <rect x="450" y="248" width="35" height="50" fill="#C9A980"/>
  <circle cx="540" cy="260" r="20" fill="#789D91"/>
  <rect x="600" y="253" width="25" height="45" fill="#B8C5B0"/>
  
  <!-- Simple chair -->
  <rect x="100" y="480" width="100" height="8" fill="#C9A980"/>
  <rect x="140" y="488" width="20" height="112" fill="#C9A980"/>
  <rect x="108" y="565" width="15" height="35" fill="#C9A980"/>
  <rect x="177" y="565" width="15" height="35" fill="#C9A980"/>
  
  <!-- Simple side table -->
  <rect x="280" y="500" width="120" height="100" fill="#E5D4B8"/>
  <rect x="288" y="508" width="104" height="84" fill="#FAFAFA"/>
  <rect x="290" y="565" width="15" height="35" fill="#C9A980"/>
  <rect x="375" y="565" width="15" height="35" fill="#C9A980"/>
  
  <!-- Plant on table -->
  <ellipse cx="340" cy="530" rx="25" ry="30" fill="#B8C5B0"/>
  <ellipse cx="340" cy="535" rx="20" ry="25" fill="#789D91"/>
  <rect x="330" y="535" width="20" height="25" fill="#D4B896"/>
  
  <!-- Minimalist picture frame on wall -->
  <rect x="480" y="380" width="140" height="100" fill="#FAFAFA" stroke="#2D2D2D" stroke-width="3"/>
  <circle cx="550" cy="430" r="25" fill="#B8C5B0" opacity="0.4"/>
  
  <!-- Text label -->
  <text x="400" y="750" font-family="Arial, sans-serif" font-size="24" fill="#2D2D2D" text-anchor="middle">
    Habitación Estilo Nórdico
  </text>
  <text x="400" y="780" font-family="Arial, sans-serif" font-size="16" fill="#789D91" text-anchor="middle">
    Diseño Minimalista y Luminoso
  </text>
</svg>
